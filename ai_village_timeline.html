</section>`);
  const $ = id => document.getElementById(id);
  const el = $("ask"), body = $("askBody"), q = $("askQ");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const st = { thread: null, session: null, ctxKey: null, busy: false, ok: null, turns: 0, view: "chat" };
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + Math.random().toString(16).slice(2)).replace(/[^0-9a-f-]/gi, "");

  const mdInline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>");
  function md(src) {
    const out = []; let list = null; const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const raw of String(src || "").split("\n")) {
      const l = raw.trimEnd(); let m;
      if (!l.trim()) { close(); continue; }
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); out.push(`<h3>${mdInline(m[2])}</h3>`); }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${mdInline(m[1])}</li>`); }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${mdInline(m[1])}</li>`); }
      else if ((m = l.match(/^>\s?(.*)/))) { close(); out.push(`<blockquote>${mdInline(m[1])}</blockquote>`); }
      else { close(); out.push(`<p>${mdInline(l)}</p>`); }
    }
    close(); return out.join("");
  }
  const intro = () => st.ok === false
    ? `<div class="err">Asking needs the local server, which reads the raw logs. Run:</div><p><code>python3 viz/server.py</code></p><p class="meta">then open this page from http://localhost:8766/. Answers come from the Claude Code CLI using your Claude login.</p>`
    : `<div class="empty">${cfg.intro || "Claude searches the raw logs for the selection and answers with timestamped evidence. Follow-ups continue the conversation; every conversation is saved under History."}</div>`;
  const turnHTML = t => `<div class="q">${esc(t.q)}</div><div class="a">${t.steps?.length ? `<details><summary>Searched logs (${t.steps.length} step${t.steps.length > 1 ? "s" : ""})</summary>${t.steps.map(s => `<div>${esc(s)}</div>`).join("")}</details>` : ""}<div class="txt">${md(t.a)}</div><div class="meta">${esc(t.meta || "")}</div></div>`;

  function render() {
    const n = cfg.count();
    $("askTitle").textContent = cfg.title(n);
    $("selCount") && ($("selCount").textContent = n);
    $("askChips").innerHTML = cfg.chips();
    $("askHist").classList.toggle("on", st.view === "history");
    $("askSugg").innerHTML = (cfg.suggestions || []).map(s => `<button>${esc(s)}</button>`).join("");
    if (st.view === "chat" && !st.turns) body.innerHTML = intro();
    $("askGo").disabled = st.busy || !n || st.ok === false;
  }
  function show() { el.classList.add("show"); el.classList.remove("min"); render(); }

  async function showHistory() {
    st.view = "history"; render();
    body.innerHTML = `<div class="empty">Loading…</div>`;
    try {
      const list = await (await fetch(`/api/history?page=${encodeURIComponent(cfg.page)}`)).json();
      body.innerHTML = list.length ? `<div class="hist">${list.map(h => `<div class="hi${h.id === st.thread ? " cur" : ""}" data-hid="${esc(h.id)}">
          <span class="ht">${esc(h.title)}</span><button class="hx" data-del="${esc(h.id)}" title="Delete this conversation">×</button>
          <span class="hm">${esc(new Date(h.updated).toLocaleString())} · ${h.turns} question${h.turns > 1 ? "s" : ""} · ${esc(h.context)}</span></div>`).join("")}</div>`
        : `<div class="empty">No saved conversations yet for this page.</div>`;
    } catch (e) { body.innerHTML = intro(); }
  }
  async function openThread(id) {
    const h = await (await fetch(`/api/history/${encodeURIComponent(id)}?page=${encodeURIComponent(cfg.page)}`)).json();
    if (h.selection != null) cfg.restore(h.selection);
    st.thread = h.id; st.session = h.session; st.ctxKey = cfg.key(); st.turns = h.turns.length; st.view = "chat";
    if (h.model) $("askModel").value = h.model;
    render();
    body.innerHTML = `<div class="divider">Saved conversation · ${esc(h.context)}</div>` + h.turns.map(turnHTML).join("");
    body.scrollTop = body.scrollHeight;
  }

  async function go() {
    const question = q.value.trim();
    if (!question || st.busy || !cfg.count()) return;
    if (st.view !== "chat") { st.view = "chat"; body.innerHTML = ""; }
    if (!st.turns) body.innerHTML = "";
    if (st.session && st.ctxKey !== cfg.key()) {          // selection changed -> new context, new saved thread
      st.session = null; st.thread = null;
      body.insertAdjacentHTML("beforeend", `<div class="divider">New context: ${esc(cfg.title(cfg.count()))}</div>`);
    }
    if (!st.thread) st.thread = newId();
    const payload = { ...cfg.payload(question), question, session: st.session, model: $("askModel").value,
      thread: st.thread, page: cfg.page, selection: cfg.snapshot(), context: cfg.label ? cfg.label() : cfg.title(cfg.count()) };
    body.insertAdjacentHTML("beforeend", `<div class="q">${esc(question)}</div><div class="a"><details><summary><span class="pulse"></span>Searching logs…</summary></details><div class="txt"></div><div class="meta"></div></div>`);
    const box = body.lastElementChild, steps = box.querySelector("details"), txt = box.querySelector(".txt"), meta = box.querySelector(".meta");
    q.value = ""; st.busy = true; st.turns++; render();
    const t0 = Date.now(); let text = "", nSteps = 0, raf = 0;
    const tick = setInterval(() => $("askStatus").textContent = `working… ${Math.round((Date.now() - t0) / 1000)}s`, 500);
    const paint = () => { raf = 0; txt.innerHTML = md(text); body.scrollTop = body.scrollHeight; };
    try {
      const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      if (!st.session) st.ctxKey = cfg.key();
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl); buf = buf.slice(nl + 1); if (!line.trim()) continue;
          const m = JSON.parse(line);
          if (m.t === "text") { text += m.d; if (!raf) raf = requestAnimationFrame(paint); }
          else if (m.t === "tool") {
            // text before a tool call is narration ("let me search…") -> fold it into the steps list
            if (text.trim()) { steps.insertAdjacentHTML("beforeend", `<div>💬 ${esc(text.trim().split("\n")[0].slice(0, 140))}</div>`); text = ""; paint(); }
            nSteps++; steps.insertAdjacentHTML("beforeend", `<div>🔎 ${esc(m.d)}</div>`);
            steps.querySelector("summary").innerHTML = `<span class="pulse"></span>Searching logs… (${nSteps} step${nSteps > 1 ? "s" : ""})`;
          } else if (m.t === "done") {
            if (m.session) st.session = m.session;
            if (m.error) txt.insertAdjacentHTML("afterend", `<div class="err">${esc(m.error)}</div>`);
            meta.textContent = m.meta || "";
          } else if (m.t === "error") txt.insertAdjacentHTML("afterend", `<div class="err">${esc(m.d)}</div>`);
        }
      }
      paint();
    } catch (err) {
      box.insertAdjacentHTML("beforeend", `<div class="err">Request failed: ${esc(err.message)}. Is <code>python3 viz/server.py</code> running, and is this page opened from it?</div>`);
    } finally {
      clearInterval(tick); $("askStatus").textContent = ""; st.busy = false;
      steps.querySelector("summary").textContent = nSteps ? `Searched logs (${nSteps} step${nSteps > 1 ? "s" : ""})` : "Answered from context";
      render(); q.focus();
    }
  }

  $("askHist").onclick = () => st.view === "history" ? (st.view = "chat", st.turns ? (body.innerHTML = "", st.thread ? openThread(st.thread) : render()) : render()) : showHistory();
  $("askClose").onclick = () => el.classList.remove("show");
  $("askMin").onclick = () => el.classList.toggle("min");
  $("askClear").onclick = () => { cfg.clear(); render(); };
  $("askNew").onclick = () => { st.session = null; st.thread = null; st.turns = 0; st.view = "chat"; render(); };
  $("askGo").onclick = go;
  $("askSugg").onclick = e => { const b = e.target.closest("button"); if (b) { q.value = b.textContent; q.focus(); } };
  q.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(); } });
  $("askChips").addEventListener("click", e => { const b = e.target.closest("[data-unsel]"); if (b && cfg.unselect) { cfg.unselect(b.dataset.unsel); render(); } });
  body.addEventListener("click", async e => {
    const del = e.target.closest("[data-del]");
    if (del) {
      e.stopPropagation();
      if (!confirm("Delete this saved conversation?")) return;
      await fetch(`/api/history/${encodeURIComponent(del.dataset.del)}?page=${encodeURIComponent(cfg.page)}`, { method: "DELETE" });
      if (del.dataset.del === st.thread) { st.thread = null; st.session = null; st.turns = 0; }
      return showHistory();
    }
    const hi = e.target.closest("[data-hid]"); if (hi) openThread(hi.dataset.hid);
  });
  const btn = $("askBtn"); if (btn) btn.onclick = show;
  fetch("/api/health").then(r => r.json()).then(j => st.ok = !!j.ok).catch(() => st.ok = false).finally(render);
  render();
  return { render, show, el };
}

const askPanel = createAskPanel({
  page: "timeline",
  title: n => `Ask about ${n} selected incident${n === 1 ? "" : "s"}`,
  placeholder: "e.g. How did the trolls force the chat shutdown?  (⌘/Ctrl+Enter to send)",
  count: () => state.sel.size,
  key: () => [...state.sel].sort((a, b) => a - b).join(","),
  chips: () => state.sel.size ? [...state.sel].sort((a, b) => a - b).map(id => { const i = DATA.incidents[id];
      return `<span class="chip"><span class="sw" style="background:var(--c-${i.category})"></span><span class="tx" title="${esc(i.title)}">${fmtD(i.date).replace(/, \d+$/, "")} · ${esc(i.title)}</span><button data-unsel="${id}" title="Remove">×</button></span>`; }).join("")
    : `<span class="empty">Select incidents in the Events view (click a dot, or a card when zoomed into a month).</span>`,
  label: () => [...state.sel].sort((a, b) => a - b).map(id => `${DATA.incidents[id].date} ${DATA.incidents[id].title}`).join("; ").slice(0, 300),
  snapshot: () => [...state.sel],
  restore: ids => { state.sel = new Set(ids); const first = DATA.incidents[ids[0]]; if (first) { state.view = "events"; state.month = first.date.slice(0, 7); } render(); },
  unselect: id => { state.sel.delete(+id); render(); },
  clear: () => { state.sel.clear(); render(); },
  payload: () => ({ kind: "incidents", incidents: [...state.sel].map(id => { const i = DATA.incidents[id]; return { date: i.date, title: i.title, summary: i.summary, category: i.category, agents: i.agents }; }) }),
});
const askEl = askPanel.el, renderAsk = askPanel.render;
function toggleSel(id) {
  state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id);
  if (state.sel.size) askEl.classList.add("show");
  render(); renderAsk();
}

</script>
<div class="static-note">Data: AI Digest, “AI Village dataset”, 2026. <a href="https://theaidigest.org/village">theaidigest.org/village</a> · <a href="https://huggingface.co/datasets/aidigestorg/ai-village">huggingface.co/datasets/aidigestorg/ai-village</a>. Summaries and labels are LLM-generated — verify in the logs. The “Ask about selection” LLM panel works when run locally — <a href="https://github.com/Plswearpants/ai-village-explorer#run-locally">how</a>. <button onclick="this.parentNode.remove()" title="Dismiss" style="border:0;background:none;cursor:pointer;color:inherit;font-size:13px;margin-left:4px">×</button></div>
</body>
